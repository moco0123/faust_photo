<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scroll Story - 夏の記憶</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- イントロダクション -->
    <header class="vignette">
        <div class="intro-content">
            <h1>夏の記憶</h1>
            <p>ゆっくりとスクロールしてください</p>
            <div class="arrow"></div>
        </div>
    </header>

    <main class="story-container">
        <!-- シーン 1 -->
        <section class="scene">
            <div class="media reveal fade-up">
                <img src="https://picsum.photos/id/15/800/1000" alt="海辺の景色">
            </div>
            <div class="caption reveal fade-up">
                <p>あの日の海は、どこまでも澄んでいた。</p>
            </div>
        </section>

        <!-- シーン 2 -->
        <section class="scene">
            <div class="media reveal fade-up">
                <img src="https://picsum.photos/id/46/800/1000" alt="古い家屋">
            </div>
            <div class="caption reveal fade-up">
                <p>古い木造の駅舎。風が通り抜ける音だけが聞こえていた。</p>
            </div>
        </section>

        <!-- シーン 3 -->
        <section class="scene">
            <div class="media reveal fade-up">
                <img src="https://picsum.photos/id/1043/800/1000" alt="森の中">
            </div>
            <div class="caption reveal fade-up">
                <p>深い森の奥で、失くした言葉を探していた。</p>
            </div>
        </section>

        <!-- エンディング -->
        <section class="scene">
            <div class="media reveal fade-up">
                <img src="https://picsum.photos/id/192/800/1000" alt="夕暮れ">
            </div>
            <div class="caption reveal fade-up">
                <p>日は沈み、また新しい明日が始まる。</p>
            </div>
        </section>
    </main>

    <footer class="outro">
        <p>完</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
