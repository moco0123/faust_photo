<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Scroll Story - 夏の記憶</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>

    <!-- イントロダクション -->
    <header class="vignette">
        <div class="intro-content">
            <h1>悲劇の始まり</h1>
            <p>ゆっくりとスクロールしてください</p>
            <div class="arrow"></div>
        </div>
    </header>

    <main class="story-container">
        <!-- シーン 1 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/15/800/600" alt="風景1-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/16/800/600" alt="風景1-2">
            </div>
            <div class="caption reveal fade-up">
                <p>ファウストは絶望した。</p>
            </div>
        </section>

        <!-- シーン 2 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/46/800/600" alt="風景2-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/47/800/600" alt="風景2-2">
            </div>
            <div class="caption reveal fade-up">
                <p>古い木造の駅舎。風が通り抜ける音だけが聞こえていた。</p>
            </div>
        </section>

        <!-- シーン 3 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/1043/800/600" alt="風景3-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/1044/800/600" alt="風景3-2">
            </div>
            <div class="caption reveal fade-up">
                <p>深い森の奥で、失くした言葉を探していた。</p>
            </div>
        </section>

        <!-- シーン 4 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/1050/800/600" alt="風景4-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/1051/800/600" alt="風景4-2">
            </div>
            <div class="caption reveal fade-up">
                <p>光が差し込むその瞬間を、ずっと待っていた。</p>
            </div>
        </section>

        <!-- シーン 5 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/1050/800/600" alt="風景5-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/1051/800/600" alt="風景5-2">
            </div>
            <div class="caption reveal fade-up">
                <p>光が差し込むその瞬間を、ずっと待っていた。</p>
            </div>
        </section>

        <!-- シーン 6 -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/1050/800/600" alt="風景6-1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/1051/800/600" alt="風景6-2">
            </div>
            <div class="caption reveal fade-up">
                <p>光が差し込むその瞬間を、ずっと待っていた。</p>
            </div>
        </section>

        <!-- エンディング -->
        <section class="scene">
            <div class="media reveal fade-left">
                <img src="https://picsum.photos/id/192/800/600" alt="夕暮れ1">
            </div>
            <div class="media reveal fade-right">
                <img src="https://picsum.photos/id/193/800/600" alt="夕暮れ2">
            </div>
            <div class="caption reveal fade-up">
                <p>日は沈み、また新しい明日が始まる。</p>
            </div>
        </section>
    </main>

    <footer class="outro">
        <p>完</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
